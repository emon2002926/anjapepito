name: anjapepito
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1



dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^8.0.1
  http: ^1.2.2
  image_picker: ^1.2.0
  video_player: ^2.8.2


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/onboarding/anja_carton.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/onboarding/anja_carton.png"
  min_sdk_android: 21


flutter:


  uses-material-design: true

  assets:
    - assets/onboarding/
    - assets/icons/
    - assets/icons/navigation/
    - assets/images/
    - assets/video/


